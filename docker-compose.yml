# trade-system
# Stack: Postgres (app metadata) + LightRAG API + youtube-rag Flask UI
#
# LightRAG uses OpenAI-compatible HTTP APIs for BOTH chat (LLM) and embeddings.
# Put secrets in `.env` (see `.env.example`). Compose reads `.env` for ${VAR} substitution.
#
# Required in `.env` for a working stack:
#   OPENAI_API_KEY, OPENAI_COMPAT_BASE
#
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
#   open http://localhost:5004

services:

  youtube-rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.alpha5.finance/trade-system/youtube-rag:latest
    environment:
      PORT: "5004"
      POSTGRES_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres.alpha5.finance:5432/${POSTGRES_DB:-youtube_rag}
      LIGHTRAG_SERVICE_URL: http://lightrag.alpha5.finance:9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      LIGHTRAG_QUERY_MODE: ${LIGHTRAG_QUERY_MODE:-hybrid}
      LIGHTRAG_CONNECT_TIMEOUT: ${LIGHTRAG_CONNECT_TIMEOUT:-30}
      LIGHTRAG_QUERY_TIMEOUT: ${LIGHTRAG_QUERY_TIMEOUT:-900}
      LIGHTRAG_INGEST_TIMEOUT: ${LIGHTRAG_INGEST_TIMEOUT:-600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE: ${OPENAI_BASE:-http://host.docker.internal:8001/v1}
      API_URL: ${API_URL:-http://host.docker.internal:5005/transcribe}
      DOWNLOAD_FOLDER: /app/docs/mp3
      TEXT_FOLDER: /app/docs/txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/AI-Docs/youtube/finance/:/app/docs
    ports:
      - "5004:5004"

volumes:
  pgdata:
  lightrag_data:
